<section class="car-parts-page">
  <article class="catalog-card">
    <h1 class="catalog-title">Toyota Parts Catalog</h1>

    <form class="catalog-form" (submit)="$event.preventDefault(); configure()">
      <div class="field">
        <label class="field-label" for="vin-number">VIN Number*</label>
        <input
          id="vin-number"
          class="field-input"
          type="text"
          maxlength="17"
          spellcheck="false"
          autocomplete="off"
          [value]="vin()"
          (input)="onVinInput($event)"
        />
        <p class="field-hint">17 characters, no letters I, O, Q</p>
      </div>

      <div class="field">
        <label class="field-label" for="oem-part-number">OEM Part Number*</label>
        <input
          id="oem-part-number"
          class="field-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          [value]="oemPartNumber()"
          (input)="onOemPartNumberInput($event)"
        />
        <p class="field-hint">Format: XXXXX-XXXXX</p>
      </div>

      <fieldset class="part-class">
        <legend class="part-class-label">Part Class</legend>
        <div class="part-class-options" role="radiogroup" aria-label="Part Class">
          @for (option of partClassOptions; track option.value) {
            <button
              type="button"
              class="part-class-option"
              role="radio"
              [attr.aria-checked]="partClass() === option.value"
              [class.is-selected]="partClass() === option.value"
              (click)="selectPartClass(option.value)"
            >
              <span class="option-icon" aria-hidden="true">
                @switch (option.icon) {
                  @case ('check') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  }
                  @case ('gear') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <circle cx="12" cy="12" r="3" />
                      <path
                        d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"
                        stroke-linecap="round"
                      />
                    </svg>
                  }
                  @case ('thumbs-up') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <path
                        d="M7 10v10M7 10l-3.5 1.5V20L7 18.5M7 10l4-6a2 2 0 0 1 2 2v4h6.5a2 2 0 0 1 2 2.2l-1.2 6A2 2 0 0 1 18.3 20H7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  }
                  @case ('piggy-bank') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <path
                        d="M5 11c0-3.5 2.8-6.5 6.5-6.5.9 0 1.7.2 2.5.5M18 11h1a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-1M7 14h6M9.5 8.5V7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <circle cx="15.5" cy="11.5" r="0.75" fill="currentColor" stroke="none" />
                    </svg>
                  }
                }
              </span>
              <span class="option-label">{{ option.label }}</span>
            </button>
          }
        </div>
      </fieldset>

      <button type="submit" class="configure-btn">
        <svg class="configure-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Configure
      </button>
    </form>
  </article>
</section>
